name: Lint

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies (weather-api)
              run: cd weather-api && yarn install --frozen-lockfile

            - name: Run lint (weather-api)
              run: cd weather-api && yarn lint
